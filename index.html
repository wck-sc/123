der-top:1px solid var(--line)}.composer textarea{width:100%;border:1px solid #e5e6e9;border-radius:11px;resize:none;padding:11px;height:72px;outline-color:var(--r)}.composebottom{display:flex;justify-content:space-between;align-items:center;margin-top:7px}.composebottom small{color:#aaa;font-size:11px}.right .card{display:flex;flex-direction:column;min-height:0}.scroll{overflow:auto;padding:0 12px 12px;flex:1}.item{display:flex;gap:7px;align-items:center;justify-content:space-between;padding:10px 7px;border-bottom:1px solid #f3f3f5}.item span{font-size:12px}.item button{border:1px solid #f3c2be;color:#d12d25;background:#fff6f5;border-radius:8px;padding:5px 8px;font-size:11px}.item button.on{background:var(--r);color:#fff}.rightfoot{padding:12px;border-top:1px solid var(--line)}.rightfoot .btn{width:100%}.modal{position:fixed;inset:0;background:#1119;display:none;align-items:center;justify-content:center;z-index:99;padding:20px}.modal.show{display:flex}.modal .content{background:white;border-radius:20px;padding:18px;width:min(350px,100%);text-align:center}.modal img{max-width:100%;max-height:450px;object-fit:contain}.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#222;color:white;padding:9px 15px;border-radius:9px;display:none;z-index:100}@media(max-width:1100px){.layout{grid-template-columns:260px minmax(350px,1fr);height:auto}.center{min-height:680px}.right{grid-column:1/-1}.right .scroll{max-height:260px;display:grid;grid-template-columns:repeat(3,1fr);gap:0 12px}}@media(max-width:700px){header{height:auto;padding:10px 14px}.brand strong{font-size:14px}.brand img{width:70px;height:38px}.layout{display:flex;flex-direction:column;padding:10px;height:auto}.left{order:1}.center{order:2;height:650px;min-height:0}.right{order:3}.scene{height:220px}.right .scroll{grid-template-columns:repeat(2,1fr)}.chathead h2{font-size:16px}}
</style></head><body><header><div class="brand"><img src="logo.jpg" alt="京东"><div><strong>全屋家电选购顾问</strong><span>轻松选好家电 · 专属全屋方案</span></div></div><button class="btn red" id="wechat">＋ 添加导购微信</button></header><main class="layout"><aside class="left"><section class="card"><div class="hd"><b>您的 3D 家</b><small>拖动旋转 · 点击空间</small></div><div class="scene"><iframe id="scene" src="scene.html" title="可交互3D样板房"></iframe><span class="tag" id="sceneTag">3D 样板房 · 上传图纸可尝试重建</span></div><div class="roomline" id="rooms"></div></section><section class="card"><div class="hd"><b>上传您的户型图</b><small>可跳过</small></div><div class="upload"><label for="floor">＋ 选择平面户型图（JPG / PNG）</label><input type="file" id="floor" accept="image/png,image/jpeg,image/webp"><img id="preview" class="preview" alt="户型图预览"><button class="btn red" id="analyzeFloor" style="width:100%;margin-top:10px">AI 识别户型 · 生成 3D 概念模型</button><div class="small" id="floorstatus">上传图纸后点击「AI 识别并生成 3D」；识别结果为待核对的概念模型。</div></div></section><section class="card"><div class="hd"><b>房屋信息</b><small>只填必要信息</small></div><div class="facts"><div class="row"><div><label>城市</label><input id="city" placeholder="如：北京"></div><div><label>户型</label><select id="house"><option>三室一厅一卫</option><option>两室一厅一卫</option><option>三室两厅两卫</option><option>四室两厅两卫</option><option>一室一厅一卫</option></select></div></div><div style="margin-top:9px"><label>全屋预算</label><select id="budget"><option value="80000">8 万元</option><option value="100000">10 万元</option><option value="120000">12 万元</option><option value="140000">14 万元</option><option value="168000" selected>16.8 万元</option></select></div></div></section></aside><section class="center"><div class="card chatcard"><div class="chathead"><div><h2>全屋家电选购顾问</h2><p>说一句需求，直接生成分空间配置方案</p></div><span class="badge" id="aiStatus">连接检测中</span></div><div class="chips"><button id="sample">三室一厅一卫，16.8 万预算</button><button id="family">有孩子，重视健康和静音</button><button id="small">预算 8 万，优先实用</button></div><div class="messages" id="messages"><div class="msg bot">您好！您只需要告诉我户型和预算，例如「三室一厅一卫，16.8 万左右」，我就能先整理一份全屋家电配置建议。<br><br>不想打字的话，直接点上方快捷需求就行。</div></div><div class="composer"><textarea id="prompt" placeholder="例如：三室一厅一卫，预算 16.8 万，想要全屋智能、品质好一点……"></textarea><div class="composebottom"><small>按 Enter 发送 · Shift+Enter 换行</small><button class="btn red" id="send">生成全屋方案 →</button></div></div></div></section><aside class="right"><section class="card" style="flex:1"><div class="hd"><b>按空间选家电</b><small id="selcount">已选 0 项</small></div><div class="roomline" id="pickrooms"></div><div class="scroll" id="products"></div><div class="rightfoot"><button class="btn red" id="build">根据已选品类出方案</button></div></section></aside></main><div class="modal" id="modal"><div class="content"><b>添加您的专属导购微信</b><p class="muted">扫码沟通户型、方案与实际报价</p><img src="wechat.jpg" alt="导购微信二维码"><p><button class="btn" id="close">关闭</button></p></div></div><div class="toast" id="toast"></div><script>
const rooms=['全屋','客厅','厨房','卧室','卫生间','阳台','玄关'];const goods={'客厅':['电视','中央空调','立式空调','客厅灯具','扫地机器人','音箱','空气净化器','智能窗帘'],'厨房':['冰箱','油烟机','燃气灶','洗碗机','蒸烤箱','净水器','微波炉','厨房灯具','垃圾处理器'],'卧室':['卧室空调','卧室灯具','空气净化器','智能窗帘'],'卫生间':['智能马桶','热水器','浴霸','卫生间灯具','电吹风'],'阳台':['洗衣机','烘干机','洗烘套装','洗烘一体机','阳台灯具'],'玄关':['智能门锁','玄关灯具','智能开关']};let active='全屋',pick='客厅',selected=new Set(),catalog=[],lastText='';fetch('catalog.json').then(r=>r.json()).then(x=>catalog=x).catch(()=>{});const $=x=>document.getElementById(x);function toast(s){$('toast').textContent=s;$('toast').style.display='block';setTimeout(()=>$('toast').style.display='none',2300)}function sceneRoom(r){try{let d=$('scene').contentDocument;let btn=[...d.querySelectorAll('#rooms button')].find(b=>b.textContent.trim().includes(r==='全屋'?'全屋':r));if(btn)btn.click()}catch(e){}}function drawRooms(){ $('rooms').innerHTML='';rooms.forEach(r=>{let b=document.createElement('button');b.textContent=r;b.className=r===active?'active':'';b.onclick=()=>{active=r;drawRooms();sceneRoom(r)};$('rooms').append(b)});$('pickrooms').innerHTML='';rooms.slice(1).forEach(r=>{let b=document.createElement('button');b.textContent=r;b.className=r===pick?'active':'';b.onclick=()=>{pick=r;drawRooms();drawGoods()};$('pickrooms').append(b)})}function drawGoods(){ $('products').innerHTML='';goods[pick].forEach(g=>{let div=document.createElement('div');div.className='item';let t=document.createElement('span');t.textContent=g;let b=document.createElement('button');b.textContent=selected.has(g)?'已选 ✓':'＋ 添加';b.className=selected.has(g)?'on':'';b.onclick=()=>{selected.has(g)?selected.delete(g):selected.add(g);drawGoods()};div.append(t,b);$('products').append(div)});$('selcount').textContent='已选 '+selected.size+' 项'}drawRooms();drawGoods();$('wechat').onclick=()=>$('modal').classList.add('show');$('close').onclick=()=>$('modal').classList.remove('show');$('modal').onclick=e=>{if(e.target===$('modal'))$('modal').classList.remove('show')};$('floor').onchange=e=>{let f=e.target.files[0];if(!f)return;if(f.size>12*1024*1024){toast('请上传小于 12MB 的户型图');return}if(!f.type.startsWith('image/')){toast('请选择图片文件');return}$('preview').src=URL.createObjectURL(f);$('preview').style.display='block';$('floorstatus').textContent='已上传 '+f.name+'。当前仅本地预览，尚不能自动识别墙体并重建三维模型。'};
const prices={'电视':11000,'中央空调':36000,'立式空调':7500,'客厅灯具':3500,'扫地机器人':5000,'音箱':4000,'空气净化器':3500,'智能窗帘':2000,'冰箱':13500,'油烟机':5500,'燃气灶':3000,'洗碗机':6500,'蒸烤箱':7000,'净水器':3200,'微波炉':1200,'厨房灯具':1800,'垃圾处理器':1800,'卧室空调':5500,'卧室灯具':1600,'智能马桶':6500,'热水器':5500,'浴霸':2300,'卫生间灯具':900,'电吹风':1600,'洗衣机':6000,'烘干机':6500,'洗烘套装':11500,'洗烘一体机':8500,'阳台灯具':900,'智能门锁':4000,'玄关灯具':1200,'智能开关':500};const keys={'电视':['电视','液晶'], '冰箱':['冰箱'], '洗衣机':['洗衣机'], '烘干机':['烘干机'], '洗烘套装':['洗烘套装','洗衣机'], '洗烘一体机':['洗烘一体'], '油烟机':['油烟机','吸油烟机'], '燃气灶':['燃气灶'], '洗碗机':['洗碗机'], '空调':['空调'], '中央空调':['中央空调'], '卧室空调':['空调'], '立式空调':['柜机','立式空调'], '热水器':['热水器'], '智能马桶':['智能马桶'], '扫地机器人':['扫地机器人'], '净水器':['净水器'], '智能门锁':['智能锁','门锁'], '浴霸':['浴霸'], '蒸烤箱':['蒸烤'], '电吹风':['电吹风','吹风机'], '音箱':['音箱','音响']};function match(g){let k=keys[g]||[g];return catalog.find(p=>k.some(x=>p.name.includes(x)))}function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function makePlan(text){let budget=Number($('budget').value),m=text.match(/(8|10|12|14|16\.8|16万8|八|十|十二|十四|十六点八)\s*万/);if(m){let n={'八':8,'十':10,'十二':12,'十四':14,'十六点八':16.8,'16万8':16.8}[m[1]]||Number(m[1]);if([8,10,12,14,16.8].includes(n)){budget=n*10000;$('budget').value=budget}}let hm=text.match(/([一二三四1234])室([一二两12])厅([一二两12])卫/);if(hm){let val=hm[0];let sel=$('house');let normalized=val.replace(/两/g,'二');for(let opt of sel.options)if(opt.text===normalized){sel.value=normalized;break}}let house=$('house').value,bed=({'一':1,'二':2,'三':3,'四':4})[house[0]]||3,bath=house.includes('两卫')||house.includes('二卫')?2:1;let wantsAll=selected.size===0;let list=[];for(let [room,arr] of Object.entries(goods)){for(let g of arr){let isAlt=['立式空调','洗衣机','烘干机','洗烘一体机'].includes(g);if(wantsAll&&isAlt)continue;if(!wantsAll&&!selected.has(g))continue;let count=(room==='卧室'&&['卧室空调','卧室灯具'].includes(g))?bed:(room==='卫生间'&&['智能马桶','浴霸','卫生间灯具'].includes(g))?bath:1;if(g==='智能窗帘'&&room==='卧室')count=bed;list.push({room,g,count,price:prices[g]||1500})}}if(!wantsAll){let hasCentral=list.some(x=>x.g==='中央空调');if(hasCentral)list=list.filter(x=>!['卧室空调','立式空调'].includes(x.g));if(list.some(x=>x.g==='洗烘套装'))list=list.filter(x=>!['洗衣机','烘干机','洗烘一体机'].includes(x.g))}let sum=list.reduce((a,x)=>a+x.count*x.price,0);let ratio=Math.min(1,budget/sum);let estimate=0;list.forEach(x=>{x.price=Math.round(x.price*ratio/100)*100;estimate+=x.price*x.count});let remain=budget-estimate;let plain='【京东全屋家电选购建议 · 演示预算】\n户型：'+house+'\n预算上限：¥'+budget.toLocaleString()+'\n说明：以下为品类预算分配，不是商品售价或成交报价。\n';let grouped={};list.forEach(x=>(grouped[x.room]??=[]).push(x));for(let [room,arr] of Object.entries(grouped)){plain+='\n【'+room+'】\n';arr.forEach(x=>plain+=x.g+' × '+x.count+'｜单件预算 ¥'+x.price.toLocaleString()+'｜小计 ¥'+(x.price*x.count).toLocaleString()+'\n')}plain+='\n品类预算合计：¥'+estimate.toLocaleString()+'\n预算预留：¥'+remain.toLocaleString()+'\n商品型号、价格、库存、安装条件需导购复核。';lastText=plain;let intro='已按 '+house+'、¥'+budget.toLocaleString()+' 预算整理。'+(selected.size?'优先配置您选中的品类。':'先给您一份覆盖主要空间的参考清单。')+'\n卧室按 '+bed+' 间计算，卫生间按 '+bath+' 间计算；中央空调与分体空调、洗烘套装与单机不重复计入。';let div=document.createElement('div');div.className='msg bot';div.textContent=intro;let proposal=document.createElement('div');proposal.className='proposal';let title=document.createElement('h3');title.textContent='全屋家电配置方案 · '+house;proposal.append(title);let table=document.createElement('table');table.innerHTML='<thead><tr><th>空间 / 品类</th><th>数量</th><th>预算小计</th></tr></thead>';let tb=document.createElement('tbody');list.forEach(x=>{let tr=document.createElement('tr');let a=document.createElement('td');a.textContent=x.room+' · '+x.g;let b=document.createElement('td');b.textContent=x.count+' 件';let c=document.createElement('td');c.textContent='¥'+(x.price*x.count).toLocaleString();tr.append(a,b,c);tb.append(tr)});table.append(tb);proposal.append(table);let foot=document.createElement('div');foot.className='tot';foot.textContent='品类预算合计 ¥'+estimate.toLocaleString()+' / 上限 ¥'+budget.toLocaleString();proposal.append(foot);let note=document.createElement('div');note.className='muted';note.textContent='预算仅用于演示分配。Excel 无实时价格；SKU 链接仅为目录候选，不能保证与方案参数匹配。';proposal.append(note);let copy=document.createElement('button');copy.className='btn red';copy.style.marginTop='11px';copy.textContent='复制规范方案';copy.onclick=()=>navigator.clipboard.writeText(lastText).then(()=>toast('已复制方案')).catch(()=>prompt('请复制方案',lastText));proposal.append(copy);div.append(proposal);$('messages').append(div);$('messages').scrollTop=$('messages').scrollHeight}const history=[];let floorData=null,aiReady=false,layout=null;
function addBubble(content,kind='bot'){const div=document.createElement('div');div.className='msg '+kind;div.textContent=content;$('messages').append(div);$('messages').scrollTop=$('messages').scrollHeight;return div}
async function api(path,body){const ctrl=new AbortController();const timeout=setTimeout(()=>ctrl.abort(),45000);try{const r=await fetch('/.netlify/functions/'+path,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body),signal:ctrl.signal});const d=await r.json();if(!r.ok)throw Error(d.error||'请求失败');return d}finally{clearTimeout(timeout)}}
function extractBudget(t){const m=t.match(/(16\.8|16万8|8|10|12|14|八|十六点八|十二|十四|十)\s*万?/);if(!m)return;let n=({'八':8,'十':10,'十二':12,'十四':14,'十六点八':16.8,'16万8':16.8})[m[1]]||Number(m[1]);if([8,10,12,14,16.8].includes(n))$('budget').value=String(n*10000)}
function addAIResult(answer){lastText=answer;let div=document.createElement('div');div.className='msg bot';let body=document.createElement('div');body.style.whiteSpace='pre-wrap';body.textContent=answer;div.append(body);let copy=document.createElement('button');copy.className='btn red';copy.style.marginTop='12px';copy.textContent='复制完整方案';copy.onclick=()=>navigator.clipboard.writeText(answer).then(()=>toast('已复制')).catch(()=>toast('请手动复制'));div.append(copy);$('messages').append(div);$('messages').scrollTop=$('messages').scrollHeight}
async function send(t){const text=t||$('prompt').value.trim();if(!text)return;extractBudget(text);addBubble(text,'user');$('prompt').value='';if(!aiReady){addBubble('当前为本地预览，尚未连接 AI 服务。以下先展示规则式配置方案；部署并配置服务端 API 密钥后，才会启用真正的多轮 AI 对话。');makePlan(text);return}const busy=addBubble('正在整理您的专属方案…');$('send').disabled=true;try{const result=await api('chat',{message:text,history:history.slice(-8),house:$('house').value,budget:Number($('budget').value),city:$('city').value,selected:[...selected],layout});busy.remove();addAIResult(result.answer);history.push({role:'user',content:text},{role:'assistant',content:result.answer})}catch(e){busy.textContent='AI 服务暂不可用：'+e.message+'。您可以稍后重试。'}finally{$('send').disabled=false}}
$('send').onclick=()=>send();$('prompt').onkeydown=e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send()}};$('sample').onclick=()=>send('三室一厅一卫，16.8万元，帮我配一套完整全屋家电方案');$('family').onclick=()=>send('三室一厅一卫，有孩子，重视健康和静音，帮我出全屋方案');$('small').onclick=()=>send('三室一厅一卫，8万元预算，优先实用');$('build').onclick=()=>send('按我选择的家电品类，给我一份详细的全屋配置方案');
fetch('/.netlify/functions/status').then(r=>r.json()).then(d=>{aiReady=!!d.ready;$('aiStatus').textContent=aiReady?'● AI 已连接':'演示模式 · 未连接 AI'}).catch(()=>{$('aiStatus').textContent='演示模式 · 未连接 AI'});
$('floor').onchange=e=>{const f=e.target.files[0];if(!f)return;if(f.size>5*1024*1024){toast('户型图需小于 5MB');return}if(!['image/png','image/jpeg','image/webp'].includes(f.type)){toast('仅支持 PNG、JPG、WebP');return}const rd=new FileReader();rd.onload=()=>{floorData=rd.result;$('preview').src=floorData;$('preview').style.display='block';$('floorstatus').textContent='已选择 '+f.name+'。点击下方按钮分析。'};rd.readAsDataURL(f)};
$('analyzeFloor').onclick=async()=>{if(!floorData){toast('请先选择平面户型图');return}if(!aiReady){$('floorstatus').textContent='尚未连接 AI 识图服务；目前不能根据图纸生成专属 3D。请部署 Netlify Functions 并配置 OPENAI_API_KEY。';return}const b=$('analyzeFloor');b.disabled=true;b.textContent='AI 正在分析图纸…';try{const result=await api('floorplan',{image:floorData});layout=result.layout;$('house').value=result.house&&[...$('house').options].some(o=>o.value===result.house)?result.house:$('house').value;const iframe=$('scene');iframe.contentWindow.postMessage({type:'JD_FLOORPLAN',layout},'*');$('sceneTag').textContent='AI 概念重建 · 非施工图';$('floorstatus').textContent='已生成可旋转的概念户型。'+(result.notes||'')+' 墙体位置、比例、门窗和尺寸请人工核实。';addBubble('我已参考您上传的平面图，生成了可旋转的 3D 概念模型。它并非精确施工级建模，建议您核对空间位置与尺寸后，再确定家电安装方案。')}catch(e){$('floorstatus').textContent='识别失败：'+e.message}finally{b.disabled=false;b.textContent='AI 识别户型 · 生成 3D 概念模型'}};
</script></body></html>
